<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unit Converter</title>
    <style>
        .links {
            display: inline-block;
            margin-right: 30px;
            padding: 30px;
        }
        .box {
            border: solid black 3px;
            width: fit-content;
            height: fit-content;
            padding: 25px;
        }
        h2 {
            border-bottom: solid black 5px;
            padding-bottom: 30px;
        }
        a {
            text-decoration: none;
        }
        .reset {
            border: solid black 1px;
            display: block;
            width: fit-content;
            padding: 10px;
        }
    </style>
</head>
<body>
    <center>
        <div class="box">
            <h2>Unit Converter</h2>
            <div class="links">
                <b><u><a href="/length">Length</a></u></b>
                <a href="/weight">Weight</a>
                <a href="/temp">Temperature</a>
            </div>
            <form action="/length" method="POST">
                <div class="disappear" th:style="'display: ' + ${converterDisplay}">
                    <br>
                    Enter the length to convert
                    <br>
                    <input type="text" name="value">
                    <br><br>
                    Unit to convert from
                    <br>
                    <input type="text" name="convertFrom">
                    <br><br>
                    Unit to convert to
                    <br>
                    <input type="text" name="convertTo">
                    <br><br>
                    <button type="submit">Convert</button>
                    <br><br>
                </div>
                <div class="answer" th:style="'display: ' + ${answerDisplay}">
                    Result of your calculation
                    <br>
                    <p th:text="${originalValue} + ' ' + ${unitConvertFrom} + ' = ' + ${finalAnswer} + ' ' + ${unitConvertTo}"></p>
                    <br><br>
                    <a href="/length" class="reset">Reset</a>
                </div>
            </form>
        </div>
    </center>
</body>
</html>
